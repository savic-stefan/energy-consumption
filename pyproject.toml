[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "building-energy-forecast"
version = "0.1.0"
description = "Local one-hour-ahead household energy forecasting"
requires-python = ">=3.11"
dependencies = ["joblib>=1.4,<2", "matplotlib>=3.8,<4", "numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2"]

[project.scripts]
energy-forecast = "energy_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
